<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambio atributos con setAttribute</title>
</head>
<body>
    <!-- atributo a nuestros elementos -->
    <!-- 2 referencias uno que es un dataset relacionado a los datos modificamos, el otro es id un identificador modificar la estructura. -->
    <div id="elemento">Atributo</div>
    <script>
        const elemento = document.getElementById('elemento');
        elemento.setAttribute('data-nuevoAt','valor22');
    </script>
</body>
</html>
